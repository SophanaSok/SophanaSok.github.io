# Keep the build's two dependencies and the workflow's actions current. The
# site ships no JavaScript bundle, so an update here only ever changes what
# builds it, and `npm run verify` on the pull request says whether it still does.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      build:
        patterns: ['*']
    ignore:
      # @astrojs/check declares a peer of typescript ^5 || ^6, so a TypeScript
      # major fails `npm ci` before anything is built. Drop this rule once
      # @astrojs/check accepts the new major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
